<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Virtual Hallo"weenie"</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fixed-aspect stage; all children are positioned in % / cqw of the stage so it scales as one unit. -->
  <main id="stage" aria-label="Haunted castle scene">

    <!-- 1. Background art (placeholder CSS shapes until Gemini layers exist) -->
    <div class="layer layer-sky"><div class="moon"></div></div>
    <div class="layer layer-castle">
      <div class="castle-keep"></div>
      <div class="castle-tower castle-tower-l"></div>
      <div class="castle-tower castle-tower-r"></div>
      <div class="castle-tower castle-tower-c"></div>
      <div class="castle-window"></div>
    </div>
    <div class="layer layer-mid">
      <div class="cliff"></div>
      <div class="ground"></div>
      <div class="gatehouse">
        <div class="gh-tower gh-tower-l"></div>
        <div class="gh-tower gh-tower-r"></div>
        <div class="gh-wall"></div>
        <div class="gh-arch"></div>
      </div>
      <div class="fountain"><div class="fountain-basin"></div><div class="fountain-spout"></div></div>
      <div class="statue"><div class="statue-head"></div><div class="statue-body"></div><div class="statue-hand"></div></div>
    </div>
    <div class="layer layer-fore"><div class="fore-left"></div><div class="fore-right"></div></div>

    <!-- 2. Reserved ambient effect layers (filled in checkpoint 3) -->
    <div class="layer layer-fx" id="fx-fog" aria-hidden="true"></div>
    <div class="layer layer-fx" id="fx-light" aria-hidden="true"></div>
    <div class="layer layer-fx" id="fx-bats" aria-hidden="true"></div>

    <!-- 3. Interactive hotspots (inert until checkpoint 4) -->
    <div class="layer layer-hotspots">
      <button class="hotspot" id="hot-gates" type="button" aria-label="Castle gates"></button>
      <button class="hotspot" id="hot-fountain" type="button" aria-label="Fountain"></button>
      <button class="hotspot" id="hot-statue" type="button" aria-label="Statue"></button>
    </div>

  </main>

  <!-- 4. UI: anchored to the viewport, not the stage, so it is never cropped on short screens -->
  <div class="layer-ui">
    <div class="ui-controls" id="ui-controls"></div>
    <p class="hint-line" id="hint-line" aria-live="polite"></p>
  </div>

  <!-- 5. Overlay (close-up) and 6. start screen are added in later checkpoints -->
  <script src="main.js"></script>
</body>
</html>
