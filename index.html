<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Virtual Hallo"weenie"</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fixed-aspect stage; all children are positioned in % / cqw of the stage so it scales as one unit. -->
  <main id="stage" aria-label="Haunted castle scene">

    <!-- 1. Scene art (Gemini images; originals in reference/art, processed by tools/make_assets.py) -->
    <div class="layer layer-sky"><img class="sky-img" src="assets/sky.webp" alt="" draggable="false"><img class="moon" src="assets/moon.webp" alt="" draggable="false"></div>
    <div class="layer layer-castle"><img class="castle-img" src="assets/castle.webp" alt="" draggable="false"></div>
    <!-- Fog: between the castle and the terrain, so it veils the castle base only -->
    <div class="layer layer-fx" id="fx-fog" aria-hidden="true">
      <div class="fog fog-a"></div>
      <div class="fog fog-b"></div>
    </div>
    <div class="layer layer-terrain"><img class="terrain-img" src="assets/terrain.webp" alt="" draggable="false"></div>
    <div class="layer layer-mid">
      <img class="gatehouse" src="assets/gatehouse.webp" alt="" draggable="false">
      <img class="lantern lantern-l" src="assets/lantern-lit.webp" alt="" draggable="false">
      <img class="lantern lantern-r" src="assets/lantern-lit.webp" alt="" draggable="false">
      <div class="fountain"><img src="assets/fountain.webp" alt="" draggable="false"></div>
      <!-- Statue: front pose, and the turned pose shown once story 1 is complete (html.story1-done) -->
      <div class="statue"><img class="statue-front" src="assets/statue.webp" alt="" draggable="false"><img class="statue-turned" src="assets/statue-turned.webp" alt="" draggable="false"></div>
    </div>
    <div class="layer layer-fore"><img class="fore-left" src="assets/fg-left.webp" alt="" draggable="false"><img class="fore-right" src="assets/fg-right.webp" alt="" draggable="false"></div>

    <!-- 2. Remaining ambient effect layers (fog sits lower in the stack, above) -->
    <div class="layer layer-fx" id="fx-light" aria-hidden="true">
      <div class="lantern-glow glow-l"></div>
      <div class="lantern-glow glow-r"></div>
    </div>
    <div class="layer layer-fx" id="fx-bats" aria-hidden="true">
      <div class="bat bat-1"><div class="bat-bob"><img class="bat-up" src="assets/bat-up.webp" alt="" draggable="false"><img class="bat-down" src="assets/bat-down.webp" alt="" draggable="false"></div></div>
      <div class="bat bat-2"><div class="bat-bob"><img class="bat-up" src="assets/bat-up.webp" alt="" draggable="false"><img class="bat-down" src="assets/bat-down.webp" alt="" draggable="false"></div></div>
      <div class="bat bat-3"><div class="bat-bob"><img class="bat-up" src="assets/bat-up.webp" alt="" draggable="false"><img class="bat-down" src="assets/bat-down.webp" alt="" draggable="false"></div></div>
    </div>

    <!-- 3. Interactive hotspots (inert until checkpoint 4) -->
    <div class="layer layer-hotspots">
      <button class="hotspot" id="hot-gates" type="button" aria-label="Castle gates"></button>
      <button class="hotspot" id="hot-fountain" type="button" aria-label="Fountain"></button>
      <button class="hotspot" id="hot-statue" type="button" aria-label="Statue"></button>
    </div>

  </main>

  <!-- 4. UI: anchored to the viewport, not the stage, so it is never cropped on short screens -->
  <div class="layer-ui">
    <div class="ui-controls" id="ui-controls">
      <button class="icon-btn" id="pause-btn" type="button" aria-label="Pause" aria-pressed="false">
        <svg class="icon-pause" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
        <svg class="icon-play" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>
      </button>
    </div>
    <p class="hint-line" id="hint-line" aria-live="polite"></p>
    <p class="paused-label" aria-hidden="true">Paused</p>
  </div>

  <!-- Debug-only probe (?debug): a spinning dot and the pausable clock, to prove Play/Pause stops motion and timers -->
  <div id="debug-probe" hidden><span class="probe-dot"></span><span class="probe-count">0</span></div>

  <!-- 5. Overlay: close-up of the tapped story object, same page, fades over the scene.
       Below the UI layer so Play/Pause stays reachable. Only story 1 (statue) exists so far. -->
  <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-label="Statue close-up" inert>
    <div class="closeup" id="closeup-1">
      <img class="cu-backdrop" src="assets/statue-backdrop.webp" alt="" draggable="false">
      <img class="cu-moon" src="assets/moon.webp" alt="" draggable="false">
      <!-- Statue art box: everything inside is positioned in % of the statue image, so glows and targets stay on the art -->
      <div class="cu-art">
        <img class="cu-front" src="assets/statue-close.webp" alt="" draggable="false">
        <img class="cu-turned" src="assets/statue-close-turned.webp" alt="" draggable="false">
        <div class="cu-hand-glow"></div>
        <div class="cu-eyes"><div class="cu-eye cu-eye-l"></div><div class="cu-eye cu-eye-r"></div></div>
        <!-- Trigger targets, in story order: eyes, hand, moon (moon target sits outside this box) -->
        <button class="target" id="t-eyes" type="button" aria-label="The statue's eyes"></button>
        <button class="target" id="t-hand" type="button" aria-label="The statue's raised hand"></button>
      </div>
      <button class="target" id="t-moon" type="button" aria-label="The moon"></button>
    </div>
    <button class="icon-btn back-btn" id="overlay-back" type="button" aria-label="Back to the castle">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <!-- Per-story Reset: only visible once the open story is complete (left of Play/Pause) -->
    <button class="pill-btn reset-btn" id="overlay-reset" type="button">Reset</button>
  </div>

  <!-- Tap ripples for soft feedback; above the overlay, below the UI -->
  <div id="ripple-layer" aria-hidden="true"></div>

  <!-- 6. Start screen: topmost until Enter -->
  <section id="start-screen" aria-labelledby="start-title">
    <div class="start-inner">
      <h1 id="start-title">Virtual Hallo&ldquo;weenie&rdquo;</h1>
      <p class="start-lead">A castle waits under the moon. Someone is expected.</p>
      <p class="start-note">Best with sound on. Tap things to see what answers.</p>
      <p class="start-note" id="motion-note" hidden>Reduced motion is on, so movement will be kept gentle and minimal.</p>
      <button id="enter-btn" type="button">Enter</button>
    </div>
  </section>

  <script src="state.js"></script>
  <script src="audio.js"></script>
  <script src="feedback.js"></script>
  <script src="overlay.js"></script>
  <script src="hints.js"></script>
  <script src="story-statue.js"></script>
  <script src="scene.js"></script>
  <script src="main.js"></script>
</body>
</html>
